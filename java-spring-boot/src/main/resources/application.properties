# Vercel routes container-function traffic to port 80 by default; honor a PORT override if set.
server.port=${PORT:80}
# Drain in-flight requests on Vercel's SIGTERM at scale-down.
server.shutdown=graceful
# Defer bean initialization so the HTTP port opens as early as possible on cold start
# (helps stay within Vercel's container startup/readiness window).
spring.main.lazy-initialization=true
